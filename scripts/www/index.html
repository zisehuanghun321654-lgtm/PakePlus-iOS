<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TurboOS 手机版</title>
    <style>
        /* ----- 基础重置 & 全局 ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #0a0a14 0%, #11112a 50%, #1a0f2e 100%);
            touch-action: none;
        }
        #desktop {
            position: fixed;
            inset: 0;
            bottom: 56px;
            /* 任务栏高度增加 */
            overflow: hidden;
            touch-action: none;
        }
        body.turbo-fullscreen #desktop {
            bottom: 0;
        }
        body.turbo-fullscreen #taskbar {
            background: rgba(15, 15, 30, 0.9);
            backdrop-filter: blur(4px);
        }

        /* ----- 桌面图标（适配触摸） ----- */
        .icon {
            position: absolute;
            width: 72px;
            /* 手机略小 */
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: default;
            padding: 6px 4px;
            border-radius: 10px;
            transition: background 0.12s;
            z-index: 1;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }
        .icon:hover {
            background: rgba(255, 255, 255, 0.12);
        }
        .icon.dragging {
            opacity: 0.7;
            z-index: 999;
            transform: scale(1.08);
        }
        .icon .glyph {
            font-size: 34px;
            line-height: 1;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.6));
            pointer-events: none;
        }
        .icon .label {
            font-size: 11px;
            color: #e0e0f0;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
            text-align: center;
            pointer-events: none;
            word-break: break-all;
            max-width: 64px;
            line-height: 1.2;
        }
        .icon.selected {
            background: rgba(160, 68, 255, 0.4);
            outline: 1px solid rgba(160, 68, 255, 0.7);
        }

        /* ----- 窗口（手机适配） ----- */
        .win {
            position: absolute;
            width: 92vw;
            height: 70vh;
            min-width: 280px;
            min-height: 200px;
            max-width: 98vw;
            max-height: 85vh;
            background: #1e1e2e;
            border: 1px solid #3a3a5c;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            z-index: 10;
            touch-action: none;
        }
        .win.maximized {
            left: 0 !important;
            top: 0 !important;
            width: 100vw !important;
            height: calc(100vh - 56px) !important;
            min-width: 0 !important;
            min-height: 0 !important;
            border-radius: 0;
        }
        .win .titlebar {
            height: 40px;
            /* 触摸友好 */
            flex: 0 0 40px;
            background: linear-gradient(180deg, #2d2d50, #232342);
            display: flex;
            align-items: center;
            padding: 0 8px;
            cursor: grab;
            gap: 6px;
            flex-shrink: 0;
            touch-action: none;
        }
        .win .titlebar:active {
            cursor: grabbing;
        }
        .win .title {
            font-size: 14px;
            color: #d0d0f0;
            flex: 1;
            margin-left: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .win .btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            color: #ccc;
            touch-action: manipulation;
        }
        .win .btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .win .btn.close {
            background: #e81123;
            color: #fff;
        }
        .win .btn.close:hover {
            background: #ff2b3e;
        }
        .win .body {
            flex: 1 1 auto;
            min-height: 0;
            overflow: auto;
            background: #15151f;
            padding: 10px;
            font-size: 14px;
            color: #ddd;
            -webkit-overflow-scrolling: touch;
        }
        .win .content {
            width: 100%;
            height: 100%;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* ----- 任务栏（手机适配） ----- */
        #taskbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: linear-gradient(180deg, #1a1a2e, #0f0f1e);
            border-top: 1px solid #33335a;
            display: flex;
            align-items: center;
            padding: 0 6px;
            z-index: 9999;
            gap: 4px;
            touch-action: manipulation;
        }
        #start-btn {
            height: 40px;
            padding: 0 12px;
            border-radius: 8px;
            background: transparent;
            border: none;
            color: #d0d0f0;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            touch-action: manipulation;
            flex-shrink: 0;
        }
        #start-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .task-item {
            height: 38px;
            min-width: 60px;
            max-width: 120px;
            padding: 0 8px;
            border-radius: 8px;
            background: #232342;
            color: #ddd;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            border: 1px solid transparent;
            white-space: nowrap;
            overflow: hidden;
            flex-shrink: 1;
            touch-action: manipulation;
        }
        .task-item.active {
            background: #353560;
            border-color: #5a5a8a;
        }
        .task-item .ti-label {
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #tray {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #aaa;
            font-size: 13px;
            padding-right: 4px;
            flex-shrink: 0;
        }
        #tray .clock {
            min-width: 60px;
            text-align: center;
            font-size: 14px;
        }
        #tray .tray-btn {
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 4px;
            touch-action: manipulation;
        }
        #arrange-btn {
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 14px;
            color: #aaa;
            touch-action: manipulation;
        }

        /* ----- 开始菜单 ----- */
        #start-menu {
            position: fixed;
            bottom: 60px;
            left: 6px;
            right: 6px;
            max-width: 320px;
            background: #1e1e2e;
            border: 1px solid #3a3a5c;
            border-radius: 14px;
            padding: 8px;
            z-index: 10000;
            box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.6);
            display: none;
            max-height: 70vh;
            overflow-y: auto;
        }
        #start-menu.open {
            display: block;
        }
        .sm-item {
            padding: 12px 14px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            color: #ddd;
            font-size: 16px;
            touch-action: manipulation;
        }
        .sm-item:hover {
            background: #353560;
        }
        .sm-item .sm-glyph {
            font-size: 22px;
        }

        /* ----- 右键菜单（长按） ----- */
        #ctx-menu {
            position: fixed;
            background: #2d2d50;
            border: 1px solid #4a4a7a;
            border-radius: 12px;
            padding: 6px;
            z-index: 10001;
            display: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            min-width: 160px;
        }
        #ctx-menu .ctx-item {
            padding: 12px 18px;
            font-size: 15px;
            color: #ddd;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 10px;
            touch-action: manipulation;
        }
        #ctx-menu .ctx-item:hover {
            background: #a044ff;
        }
        #ctx-menu .ctx-divider {
            height: 1px;
            background: #3a3a5c;
            margin: 4px 8px;
        }

        /* ----- 各应用样式微调（手机） ----- */
        .notepad-toolbar {
            flex-wrap: wrap;
        }
        .notepad-toolbar .fm-btn {
            padding: 8px 12px;
            font-size: 13px;
        }
        #note-text {
            font-size: 15px;
            padding: 10px;
        }
        .fm-main {
            flex-direction: column;
        }
        #fm-sidebar {
            width: 100%;
            flex: 0 0 auto;
            margin-right: 0;
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            padding: 4px 0;
        }
        #fm-sidebar .sb-item {
            padding: 6px 12px;
            font-size: 13px;
            background: #232342;
            border-radius: 6px;
        }
        #fm-list {
            min-height: 120px;
        }
        .fm-row {
            padding: 10px 12px;
            font-size: 14px;
        }
        .fm-actions .fm-btn {
            padding: 10px 6px;
            font-size: 13px;
            min-width: 60px;
        }

        .browser-tabs {
            flex-wrap: nowrap;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .browser-tab {
            flex: 0 0 auto;
            padding: 6px 12px;
            font-size: 12px;
            max-width: 140px;
        }
        .browser-bar {
            flex-wrap: wrap;
        }
        .browser-url {
            height: 40px;
            font-size: 15px;
            min-width: 120px;
        }
        .browser-btn {
            width: 40px;
            height: 40px;
            font-size: 16px;
        }

        .calc-grid {
            gap: 6px;
        }
        .calc-key {
            padding: 14px 0;
            font-size: 20px;
        }

        .music-cover {
            width: 100px;
            height: 100px;
            font-size: 40px;
        }
        .music-btn {
            width: 48px;
            height: 48px;
            font-size: 20px;
        }
        .music-btn.play {
            width: 64px;
            height: 64px;
            font-size: 26px;
        }

        .paint-toolbar {
            height: 50px;
            gap: 4px;
        }
        .paint-tool {
            width: 36px;
            height: 36px;
            font-size: 16px;
        }

        /* ----- 媒体查询：小屏进一步调整 ----- */
        @media (max-width: 480px) {
            .icon {
                width: 64px;
            }
            .icon .glyph {
                font-size: 30px;
            }
            .icon .label {
                font-size: 10px;
                max-width: 56px;
            }
            .win {
                width: 96vw;
                height: 60vh;
                min-width: 240px;
            }
            .win .titlebar {
                height: 36px;
                flex: 0 0 36px;
            }
            .win .btn {
                width: 28px;
                height: 28px;
                font-size: 14px;
            }
            #taskbar {
                height: 50px;
            }
            #start-btn {
                font-size: 13px;
                padding: 0 8px;
                height: 34px;
            }
            .task-item {
                min-width: 40px;
                font-size: 11px;
                height: 34px;
            }
            #tray .clock {
                font-size: 12px;
                min-width: 50px;
            }
            .fm-actions .fm-btn {
                font-size: 12px;
                padding: 8px 4px;
            }
        }

        /* ----- 滚动条美化 ----- */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="desktop"></div>
    <div id="taskbar">
        <button id="start-btn">🚀 开始</button>
        <div id="task-items"></div>
        <div id="tray">
            <span id="arrange-btn" title="自动排列">⊞</span>
            <span id="tray-net">📶</span>
            <span id="tray-vol">🔊</span>
            <span class="clock" id="clock">00:00</span>
        </div>
    </div>
    <div id="start-menu"></div>
    <div id="ctx-menu"></div>

    <script>
        // ============================================================
        //  第二部分：全部 JavaScript（从下一行开始复制）
        // ============================================================
        // 注意：由于回答长度限制，JavaScript 代码在下一段中提供。
        // 请将下面的 JavaScript 代码粘贴到此处。
"use strict";
// ============================================================
//  1. 虚拟文件系统
// ============================================================
const FS = {
    "C:": {
        "文档": {
            type: "folder",
            children: {
                "readme.txt": { type: "text", name: "readme.txt", content: "欢迎使用 TurboOS 文件管理器！\n\n功能：\n• 双击文件夹进入\n• 双击文件打开\n• 新建/删除文件\n• 拖拽移动文件\n• 右键菜单操作",
                    ext: "txt" },
                "笔记.txt": { type: "text", name: "笔记.txt", content: "2026-09-05 今日计划：\n1. 完善音乐播放器\n2. 修复浏览器加载\n3. 测试所有应用",
                    ext: "txt" }
            }
        },
        "图片": {
            type: "folder",
            children: {
                "照片1.png": { type: "image", name: "照片1.png", color: "#4a90d9", ext: "png" },
                "照片2.png": { type: "image", name: "照片2.png", color: "#e81123", ext: "png" },
                "logo.png": { type: "image", name: "logo.png", color: "#2ecc71", ext: "png" }
            }
        },
        "音乐": {
            type: "folder",
            children: {
                "song1.mp3": { type: "audio", name: "song1.mp3", ext: "mp3", track: 0 },
                "song2.mp3": { type: "audio", name: "song2.mp3", ext: "mp3", track: 1 },
                "song3.mp3": { type: "audio", name: "song3.mp3", ext: "mp3", track: 2 }
            }
        },
        "视频": {
            type: "folder",
            children: {
                "movie.mp4": { type: "video", name: "movie.mp4", ext: "mp4" }
            }
        },
        "桌面": {
            type: "folder",
            children: {
                "欢迎.txt": {
                    type: "text",
                    name: "欢迎.txt",
                    content: "欢迎使用 TurboOS！\n\n你可以：\n• 在桌面右键 → 新建文本文档\n• 在桌面右键 → 新建文件夹\n• 拖拽图标任意摆放\n• 点击「⊞ 排列」自动整理",
                    ext: "txt",
                    _pos: { x: 120, y: 120 }
                }
            }
        }
    }
};

// ============================================================
//  2. 应用定义
// ============================================================
const APPS = {
    notepad: { name: "记事本", glyph: "📝", x: 60, y: 60 },
    files: { name: "文件管理器", glyph: "📁", x: 170, y: 60 },
    browser: { name: "浏览器", glyph: "🌐", x: 280, y: 60 },
    terminal: { name: "终端", glyph: "⚡", x: 390, y: 60 },
    settings: { name: "设置", glyph: "⚙️", x: 500, y: 60 },
    calculator: { name: "计算器", glyph: "🔢", x: 60, y: 190 },
    music: { name: "音乐", glyph: "🎵", x: 190, y: 190 },
    paint: { name: "画图", glyph: "🎨", x: 320, y: 190 }
};

// ============================================================
//  3. 窗口管理（完全兼容触摸）
// ============================================================
const windows = {};
let zIndex = 10;
let windowCounter = 0;

function openWindow(appKey, opts = {}) {
    if (windows[appKey]) {
        const w = windows[appKey];
        if (w.minimized) { w.el.style.display = 'flex';
            w.minimized = false;
            updateTaskbar(); }
        focusWindow(appKey);
        return;
    }
    const app = APPS[appKey];
    const id = ++windowCounter;
    const w = {
        id,
        app: appKey,
        minimized: false,
        maximized: false,
        x: app.x + (id * 20) % 80,
        y: app.y + (id * 20) % 60
    };
    windows[appKey] = w;

    const el = document.createElement('div');
    el.className = 'win';
    el.setAttribute('data-app', appKey);
    el.style.left = w.x + 'px';
    el.style.top = w.y + 'px';
    el.style.width = opts.width || '480px';
    el.style.height = opts.height || '360px';
    el.innerHTML = `
        <div class="titlebar">
          <span style="color:#ff5f56;font-size:14px;">●</span>
          <span style="color:#ffbd2e;font-size:14px;">●</span>
          <span style="color:#27c93f;font-size:14px;">●</span>
          <span class="title">${app.name}</span>
          <div class="btn minimize" title="最小化">_</div>
          <div class="btn maximize" title="最大化">▢</div>
          <div class="btn close" title="关闭">✕</div>
        </div>
        <div class="body"><div class="content"></div></div>
      `;
    document.getElementById('desktop').appendChild(el);
    w.el = el;

    const content = el.querySelector('.content');
    renderApp(appKey, content, w);

    // 标题栏拖拽（同时支持鼠标和触摸）
    const titlebar = el.querySelector('.titlebar');
    let dragWin = false,
        startX, startY, origX, origY;

    function startDrag(e) {
        if (e.target.closest('.btn')) return;
        focusWindow(appKey);
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        startX = clientX;
        startY = clientY;
        origX = el.offsetLeft;
        origY = el.offsetTop;
        dragWin = true;
        document.addEventListener('mousemove', onDrag);
        document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchmove', onDragTouch, { passive: false });
        document.addEventListener('touchend', endDragTouch);
        e.preventDefault();
    }

    function onDrag(e) {
        if (!dragWin || w.maximized) return;
        const clientX = e.clientX;
        const clientY = e.clientY;
        el.style.left = (origX + (clientX - startX)) + 'px';
        el.style.top = (origY + (clientY - startY)) + 'px';
    }

    function onDragTouch(e) {
        if (!dragWin || w.maximized) return;
        const touch = e.touches[0];
        const clientX = touch.clientX;
        const clientY = touch.clientY;
        el.style.left = (origX + (clientX - startX)) + 'px';
        el.style.top = (origY + (clientY - startY)) + 'px';
        e.preventDefault();
    }

    function endDrag() {
        dragWin = false;
        document.removeEventListener('mousemove', onDrag);
        document.removeEventListener('mouseup', endDrag);
    }

    function endDragTouch() {
        dragWin = false;
        document.removeEventListener('touchmove', onDragTouch);
        document.removeEventListener('touchend', endDragTouch);
    }

    titlebar.addEventListener('mousedown', startDrag);
    titlebar.addEventListener('touchstart', startDrag, { passive: false });

    el.querySelector('.close').addEventListener('click', () => closeWindow(appKey));
    el.querySelector('.minimize').addEventListener('click', () => {
        w.minimized = true;
        el.style.display = 'none';
        updateTaskbar();
    });
    el.querySelector('.maximize').addEventListener('click', () => {
        if (w.maximized) { el.classList.remove('maximized');
            w.maximized = false; } else { el.classList.add('maximized');
            w.maximized = true; }
    });

    focusWindow(appKey);
    updateTaskbar();
}

function closeWindow(appKey) {
    const w = windows[appKey];
    if (!w) return;
    if (appKey === 'music') cleanupMusic();
    if (appKey === 'browser') cleanupBrowser(w);
    if (w.el && w.el.parentNode) w.el.parentNode.removeChild(w.el);
    delete windows[appKey];
    updateTaskbar();
}

function focusWindow(appKey) {
    const w = windows[appKey];
    if (!w) return;
    zIndex += 1;
    w.el.style.zIndex = zIndex;
    document.querySelectorAll('.task-item').forEach(t => t.classList.remove('active'));
    const ti = document.getElementById('task-' + appKey);
    if (ti) ti.classList.add('active');
}

function updateTaskbar() {
    const container = document.getElementById('task-items');
    container.innerHTML = '';
    Object.keys(windows).forEach(key => {
        const w = windows[key];
        const app = APPS[key];
        const item = document.createElement('div');
        item.className = 'task-item' + (w.minimized ? '' : ' active');
        item.id = 'task-' + key;
        item.innerHTML = `<span>${app.glyph}</span><span class="ti-label">${app.name}</span>`;
        item.addEventListener('click', () => {
            if (w.minimized) { w.el.style.display = 'flex';
                w.minimized = false;
                updateTaskbar();
                focusWindow(key); } else if (w.el.style.zIndex == zIndex) { w.el.style.display = 'none';
                w.minimized = true;
                updateTaskbar(); } else { w.el.style.display = 'flex';
                focusWindow(key); }
        });
        container.appendChild(item);
    });
}

// ============================================================
//  4. 应用渲染（核心功能，与之前一致，此处精简）
// ============================================================
function renderApp(key, container, w) {
    switch (key) {
        case 'notepad':
            renderNotepad(container);
            break;
        case 'files':
            renderFiles(container);
            break;
        case 'browser':
            renderBrowser(container, w);
            break;
        case 'terminal':
            renderTerminal(container);
            break;
        case 'settings':
            renderSettings(container);
            break;
        case 'calculator':
            renderCalculator(container);
            break;
        case 'music':
            renderMusic(container);
            break;
        case 'paint':
            renderPaint(container);
            break;
    }
}

// ----- 记事本（与之前相同，略作触摸优化）-----
function getNotepadWindow() {
    const w = windows['notepad'];
    return w && w.el ? w.el : null;
}

function renderNotepad(container) {
    container.innerHTML = `
        <div class="notepad-toolbar">

function clearNotepad() {

function writeNoteToFS(filename, container) {
    container = container || document;
    const ta = container.querySelector('#note-text');
    const text = ta ? ta.value : '';
    let name = (filename || '').trim();
    if (!name) return { ok: false, reason: 'empty' };
    if (!/\.[^/.]+$/.test(name)) name += '.txt';

    let docs = getPathObj(['C:', '文档']);
    if (!docs || typeof docs !== 'object') {
        FS['C:']['文档'] = { type: 'folder', children: {} };
        docs = FS['C:']['文档'].children;
    }
    let finalName = name;
    let base = name.replace(/\.[^/.]+$/, '');
    let ext = name.includes('.') ? name.slice(name.lastIndexOf('.')) : '.txt';
    let i = 1;
    while (docs[finalName]) { finalName = base + ' (' + (i++) + ')' + ext; }
    docs[finalName] = { type: 'text', name: finalName, content: text, ext: 'txt' };

    let desktop = getDesktopChildren();
    let desktopName = finalName;
    let j = 1;
    while (desktop[desktopName]) { desktopName = base + ' (' + (j++) + ')' + ext; }
    const oldPos = desktop[finalName] ? (desktop[finalName]._pos || null) : null;
    desktop[desktopName] = { type: 'text', name: desktopName, content: text, ext: 'txt', _pos: oldPos || { x: 100 +
                Math.random() * 160, y: 120 + Math.random() * 120 } };

    const win = getNotepadWindow();
    if (win) win.dataset.filePath = 'C:/桌面/' + desktopName;
    const st = container.querySelector('#np-status');
    if (st) { st.textContent = desktopName + '（已保存）';
        st.dataset.saved = desktopName; }

    renderDesktopIcons();
    if (typeof fmCurrentPath !== 'undefined' && fmCurrentPath[fmCurrentPath.length - 1] === '文档') {
        renderFmList();
    }
    return { ok: true, name: desktopName };
}

function saveNoteAs() {
    const container = document.querySelector('.win[data-app="notepad"] .content');
    const ta = container && container.querySelector('#note-text');
    if (!ta) return;
    const win = getNotepadWindow();
    const current = win && win.dataset.filePath ? win.dataset.filePath.split('/').pop() : '未命名文档.txt';
    const name = prompt('保存到「文档」和「桌面」目录，请输入文件名：', current);
    if (name === null) return;
    const r = writeNoteToFS(name, container);
    if (r.ok) alert('已保存：文档/' + r.name + '\n同时出现在桌面！');
}

function saveNote() {
    const container = document.querySelector('.win[data-app="notepad"] .content');
    const win = getNotepadWindow();
    const path = win && win.dataset.filePath ? win.dataset.filePath : '';
    const name = path ? path.split('/').pop() : '';

    if (r.ok) {

        if (st) { st.textContent = r.name + '（已保存）';

// ----- 文件管理器（与之前相同）-----
let fmCurrentPath = ["C:"];
let fmSelected = null;

function getPathObj(path) {
    if (!Array.isArray(path) || path.length === 0) return null;
    const rootKey = path[0];
    if (!FS || FS[rootKey] === undefined) return null;
    let node = FS[rootKey];
    for (let i = 1; i < path.length; i++) {
        const key = path[i];
        if (!node || node[key] === undefined) return null;
        node = node[key];
        if (!node || node.type !== 'folder' || !node.children) return null;
        node = node.children;
    }
    return (node && typeof node === 'object') ? node : null;
}

function renderFiles(container) {
    container.innerHTML = `
        <div id="fm-breadcrumb"></div>
        <div class="fm-main">
          <div id="fm-sidebar">
            <div class="sb-title">快速访问</div>

          </div>

function renderFmBreadcrumb() {
    const el = document.getElementById('fm-breadcrumb');
    if (!el) return;
    el.innerHTML = fmCurrentPath.map((p, i) => {
        const path = fmCurrentPath.slice(0, i + 1);
        return `<span style="cursor:pointer;color:#9ad;" onclick="fmGo(${JSON.stringify(path)})">${p}</span>`;
    }).join(' / ');
}

function renderFmList() {
    const list = document.getElementById('fm-list');
    if (!list) return;
    const obj = getPathObj(fmCurrentPath);
    if (!obj) { list.innerHTML = '<div style="color:#888;">（空）</div>'; return; }
    const names = Object.keys(obj);
    if (names.length === 0) { list.innerHTML = '<div style="color:#888;">（空文件夹）</div>'; return; }
    list.innerHTML = names.map(name => {
        const item = obj[name];
        const isFolder = item.type === 'folder';
        const icon = isFolder ? '📁' : (item.type === 'text' ? '📄' : (item.type === 'image' ? '🖼️' : (item
            .type === 'audio' ? '🎵' : '📦')));
        return `<div class="fm-row" data-name="${name}" ondblclick="fmOpen('${name}')">
          <span class="fm-glyph">${icon}</span>
          <span class="fm-name">${name}</span>
          <span class="fm-size">${isFolder ? '' : (item.ext || '')}</span>
        </div>`;
    }).join('');
    list.querySelectorAll('.fm-row').forEach(row => {
        row.addEventListener('click', () => {
            list.querySelectorAll('.fm-row').forEach(r => r.classList.remove('selected'));
            row.classList.add('selected');
            fmSelected = row.dataset.name;
        });
    });
}

function fmOpen(name) {
    const obj = getPathObj(fmCurrentPath);
    if (!obj) return;
    const item = obj[name];
    if (!item) return;
    if (item.type === 'folder') {
        fmCurrentPath = [...fmCurrentPath, name];
        fmSelected = null;
        renderFmBreadcrumb();
        renderFmList();
    } else if (item.type === 'text') {
        openTextInNotepad(item);
    } else if (item.type === 'image') {
        openImageFile(item);
    } else if (item.type === 'audio') {
        openWindow('music');
        setTimeout(() => playTrackByIndex(item.track || 0), 100);
    }
}

function openImageFile(item) {
    const w = windows['files'];
    if (w) {
        let imgHTML = '';
        try {
            const canvas = document.createElement('canvas');
            canvas.width = 320;
            canvas.height = 220;
            const ctx = canvas.getContext('2d');
            if (ctx) {
                ctx.fillStyle = item.color || '#4a90d9';
                ctx.fillRect(0, 0, 320, 220);
                ctx.fillStyle = '#fff';
                ctx.font = '30px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('🖼️', 160, 120);
                imgHTML = canvas.outerHTML;
            } else throw new Error('no-ctx');
        } catch (e) {
            imgHTML =
                `<div style="width:320px;height:220px;line-height:220px;background:${item.color||'#4a90d9'};color:#fff;border-radius:8px;">🖼️ ${item.name}</div>`;
        }
        w.el.querySelector('.title').textContent = item.name;
        w.el.querySelector('.body').innerHTML = `
          <div style="text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;">
            ${imgHTML}
            <div style="color:#aaa;font-size:12px;">${item.name}</div>
            <button id="fm-close-img" class="fm-btn" style="width:auto;padding:8px 24px;">✕ 关闭</button>
          </div>`;
        const closeBtn = w.el.querySelector('.body #fm-close-img');
        if (closeBtn) closeBtn.addEventListener('click', fmCloseText);
    }
}

function fmCloseText() {
    const w = windows['files'];
    if (!w) return;
    let winEl = document.querySelector('.win[data-app="files"]') || w.el;
    const content = winEl && winEl.querySelector('.content');
    if (content) {
        renderFiles(content);
    } else {
        const body = winEl.querySelector('.body');
        if (body) {
            body.innerHTML = '<div class="content"></div>';
            renderFiles(winEl.querySelector('.content'));
        }
    }
    winEl = document.querySelector('.win[data-app="files"]') || winEl;
    const titleEl = winEl && winEl.querySelector('.title');
    if (titleEl) titleEl.textContent = '文件管理器';
    if (!document.getElementById('fm-list') && w.el) {
        renderFiles(w.el.querySelector('.content') || w.el);
    }
}

function fmGo(path) {
    fmCurrentPath = Array.isArray(path) ? [...path] : [path];
    fmSelected = null;
    renderFmBreadcrumb();
    renderFmList();
}

function fmUp() {
    if (fmCurrentPath.length > 1) {
        fmCurrentPath.pop();
        fmSelected = null;
        renderFmBreadcrumb();
        renderFmList();
    }
}

function fmNewFolder() {
    const name = prompt('请输入文件夹名称：', '新建文件夹');
    if (!name || !name.trim()) return;
    const targetChildren = getPathObj(fmCurrentPath);
    if (!targetChildren || typeof targetChildren !== 'object') {
        alert('当前位置不支持新建文件夹');
        return;
    }
    let finalName = name.trim();
    if (targetChildren[finalName]) {
        let i = 1;
        while (targetChildren[finalName + ' (' + i + ')']) i++;
        finalName = finalName + ' (' + i + ')';
    }
    targetChildren[finalName] = { type: 'folder', children: {} };
    renderFmList();
    if (fmCurrentPath[fmCurrentPath.length - 1] === '桌面') renderDesktopIcons();
}

function fmDelete() {
    const list = document.getElementById('fm-list');
    if (!list) return;
    const selected = Array.from(list.querySelectorAll('.fm-row.selected'));
    if (selected.length === 0) { alert('请先单击选择要删除的文件/文件夹'); return; }
    if (confirm('确定删除选中的 ' + selected.length + ' 项吗？')) {
        const obj = getPathObj(fmCurrentPath);
        if (obj) {
            selected.forEach(row => delete obj[row.dataset.name]);
            fmSelected = null;
            renderFmList();
            if (fmCurrentPath[fmCurrentPath.length - 1] === '桌面') renderDesktopIcons();
        }
    }
}

let fmClipboard = null;
let fmClipboardCut = false;
document.addEventListener('keydown', (e) => {
    const fw = windows['files'];
    if (!fw || fw.minimized) return;
    if (!document.getElementById('fm-list')) return;
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.ctrlKey && e.key === 'c') { if (fmSelected) { fmClipboard = fmSelected;
            fmClipboardCut = false; } }
    if (e.ctrlKey && e.key === 'x') { if (fmSelected) { fmClipboard = fmSelected;
            fmClipboardCut = true; } }
    if (e.ctrlKey && e.key === 'v') { fmPaste(); }
    if (e.key === 'Delete') { fmDelete(); }
});

function fmPaste() {
    if (!fmClipboard) return;
    const obj = getPathObj(fmCurrentPath);
    if (!obj) return;
    const src = obj[fmClipboard];
    if (src) {
        let newName = fmClipboard;
        let base = fmClipboard.replace(/\.[^/.]+$/, "");
        let ext = fmClipboard.includes('.') ? fmClipboard.slice(fmClipboard.lastIndexOf('.')) : '';
        let i = 1;
        while (obj[newName]) { newName = base + ' (' + i + ')' + ext;
            i++; }
        obj[newName] = JSON.parse(JSON.stringify(src));
        if (fmClipboardCut) { delete obj[fmClipboard];
            fmClipboard = null;
            fmClipboardCut = false; }
        renderFmList();
        if (fmCurrentPath[fmCurrentPath.length - 1] === '桌面') renderDesktopIcons();
    }
}

    const content = pre ? pre.textContent : '';

// ============================================================
//  5. 桌面图标管理（触摸适配：双击 + 拖拽 + 长按菜单）
// ============================================================
let desktopIcons = [];
let dragState = null;
let dragJustFinished = false;
let longPressTimer = null;
let longPressTriggered = false;

function getDesktopChildren() {
    let desktop = getPathObj(['C:', '桌面']);
    if (!desktop || typeof desktop !== 'object') {
        FS['C:']['桌面'] = { type: 'folder', children: {} };
        desktop = FS['C:']['桌面'].children;
    }
    return desktop;
}

function createIconElement(type, id, glyph, label, x, y) {
    const el = document.createElement('div');
    el.className = 'icon';
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.dataset.type = type;
    el.dataset.id = id;
    el.innerHTML = `<span class="glyph">${glyph}</span><span class="label">${label}</span>`;
    return el;
}

function renderDesktopIcons() {
    const desktop = document.getElementById('desktop');
    desktop.querySelectorAll('.icon').forEach(el => el.remove());
    desktopIcons = [];

    // 应用图标（双击打开）
    Object.keys(APPS).forEach(key => {
        const app = APPS[key];
        const el = createIconElement('app', key, app.glyph, app.name, app.x, app.y);
        el.dataset.appKey = key;
        // 双击（鼠标）和触摸双击检测
        el.addEventListener('dblclick', (e) => {
            e.stopPropagation();
            if (dragJustFinished) { dragJustFinished = false; return; }
            openWindow(key);
        });
        // 触摸双击：在 touchend 中检测两次点击间隔
        let lastTapTime = 0;
        el.addEventListener('touchend', (e) => {
            const now = Date.now();
            if (now - lastTapTime < 350 && !longPressTriggered) {
                e.stopPropagation();
                if (dragJustFinished) { dragJustFinished = false; return; }
                openWindow(key);
                lastTapTime = 0;
            } else {
                lastTapTime = now;
            }
        });
        desktop.appendChild(el);
        desktopIcons.push(el);
    });

    // 桌面文件
    const deskChildren = getDesktopChildren();
    const names = Object.keys(deskChildren);
    let defaultX = 60,
        defaultY = 300;
    names.forEach((name, idx) => {
        const item = deskChildren[name];
        const pos = item._pos || { x: defaultX + (idx % 5) * 100, y: defaultY + Math.floor(idx / 5) * 110 };
        let glyph = '📄';
        if (item.type === 'folder') glyph = '📁';
        else if (item.type === 'image') glyph = '🖼️';
        else if (item.type === 'audio') glyph = '🎵';
        else if (item.type === 'video') glyph = '🎬';
        const el = createIconElement('file', name, glyph, name, pos.x, pos.y);
        el.dataset.fileName = name;

        const openFile = () => {
            if (dragJustFinished) { dragJustFinished = false; return; }
            if (item.type === 'text') openTextInNotepad(item);
            else if (item.type === 'folder') { openWindow('files');
                setTimeout(() => { fmGo(['C:', '桌面']); }, 80); } else if (item.type === 'image') { openWindow(
                    'files');
                setTimeout(() => { fmGo(['C:', '桌面']);
                    const w = windows['files']; if (w) { /* 显示图片 */ } }, 100); } else { openWindow('files');
                setTimeout(() => { fmGo(['C:', '桌面']); }, 80); }
        };
        el.addEventListener('dblclick', (e) => { e.stopPropagation();
            openFile(); });
        let lastTapTime = 0;
        el.addEventListener('touchend', (e) => {
            const now = Date.now();
            if (now - lastTapTime < 350 && !longPressTriggered) {
                e.stopPropagation();
                openFile();
                lastTapTime = 0;
            } else {
                lastTapTime = now;
            }
        });
        desktop.appendChild(el);
        desktopIcons.push(el);
    });

    // 拖拽（鼠标 + 触摸）
    desktopIcons.forEach(el => {
        el.addEventListener('mousedown', onIconMouseDown);
        el.addEventListener('touchstart', onIconTouchStart, { passive: false });
        // 长按菜单（触摸）
        el.addEventListener('touchstart', (e) => {
            longPressTriggered = false;
            longPressTimer = setTimeout(() => {
                longPressTriggered = true;
                const touch = e.touches[0];
                showIconContextMenu(touch.clientX, touch.clientY, el);
            }, 600);
        }, { passive: true });
        el.addEventListener('touchend', () => { clearTimeout(longPressTimer); });
        el.addEventListener('touchmove', () => { clearTimeout(longPressTimer); });
    });

    // 点击桌面空白取消选中
    desktop.addEventListener('mousedown', (e) => {
        if (e.target === desktop) {
            desktopIcons.forEach(ic => ic.classList.remove('selected'));
        }
    });
    desktop.addEventListener('touchstart', (e) => {
        if (e.target === desktop) {
            desktopIcons.forEach(ic => ic.classList.remove('selected'));
        }
    });
}

// ---- 鼠标拖拽 ----
function onIconMouseDown(e) {
    if (e.button !== 0) return;
    const el = e.currentTarget;
    e.stopPropagation();
    const rect = el.getBoundingClientRect();
    const offsetX = e.clientX - rect.left;
    const offsetY = e.clientY - rect.top;
    const startX = parseInt(el.style.left) || 0;
    const startY = parseInt(el.style.top) || 0;
    dragState = { el, offsetX, offsetY, startX, startY, moved: false };
    el.classList.add('dragging');
    el.style.zIndex = 999;
    document.addEventListener('mousemove', onDragMove);
    document.addEventListener('mouseup', onDragEnd);
    document.body.style.userSelect = 'none';
    dragJustFinished = false;
}

// ---- 触摸拖拽 ----
function onIconTouchStart(e) {
    const touch = e.touches[0];
    if (!touch) return;
    const el = e.currentTarget;
    e.stopPropagation();
    const rect = el.getBoundingClientRect();
    const offsetX = touch.clientX - rect.left;
    const offsetY = touch.clientY - rect.top;
    const startX = parseInt(el.style.left) || 0;
    const startY = parseInt(el.style.top) || 0;
    dragState = { el, offsetX, offsetY, startX, startY, moved: false, isTouch: true };
    el.classList.add('dragging');
    el.style.zIndex = 999;
    document.addEventListener('touchmove', onDragMoveTouch, { passive: false });
    document.addEventListener('touchend', onDragEndTouch);
    dragJustFinished = false;
    clearTimeout(longPressTimer);
}

function onDragMove(e) {
    if (!dragState || dragState.isTouch) return;
    const { el, offsetX, offsetY } = dragState;
    const desktop = document.getElementById('desktop');
    const desktopRect = desktop.getBoundingClientRect();
    let newX = e.clientX - desktopRect.left - offsetX;
    let newY = e.clientY - desktopRect.top - offsetY;
    newX = Math.max(0, Math.min(newX, desktopRect.width - 80));
    newY = Math.max(0, Math.min(newY, desktopRect.height - 60));
    el.style.left = newX + 'px';
    el.style.top = newY + 'px';
    dragState.moved = true;
}

function onDragMoveTouch(e) {
    if (!dragState || !dragState.isTouch) return;
    const touch = e.touches[0];
    if (!touch) return;
    const { el, offsetX, offsetY } = dragState;
    const desktop = document.getElementById('desktop');
    const desktopRect = desktop.getBoundingClientRect();
    let newX = touch.clientX - desktopRect.left - offsetX;
    let newY = touch.clientY - desktopRect.top - offsetY;
    newX = Math.max(0, Math.min(newX, desktopRect.width - 80));
    newY = Math.max(0, Math.min(newY, desktopRect.height - 60));
    el.style.left = newX + 'px';
    el.style.top = newY + 'px';
    dragState.moved = true;
    e.preventDefault();
}

function onDragEnd(e) {
    if (!dragState || dragState.isTouch) return;
    finishDrag();
}

function onDragEndTouch(e) {
    if (!dragState || !dragState.isTouch) return;
    finishDrag();
}

function finishDrag() {
    if (!dragState) return;
    const { el, moved } = dragState;
    el.classList.remove('dragging');
    el.style.zIndex = '';
    document.removeEventListener('mousemove', onDragMove);
    document.removeEventListener('mouseup', onDragEnd);
    document.removeEventListener('touchmove', onDragMoveTouch);
    document.removeEventListener('touchend', onDragEndTouch);
    document.body.style.userSelect = '';
    if (moved) {
        const newX = parseInt(el.style.left) || 0;
        const newY = parseInt(el.style.top) || 0;
        const type = el.dataset.type;
        if (type === 'file') {
            const desk = getDesktopChildren();
            const fileName = el.dataset.fileName || el.dataset.id;
            if (desk && desk[fileName]) {
                desk[fileName]._pos = { x: newX, y: newY };
            }
        } else if (type === 'app') {
            const appKey = el.dataset.appKey;
            if (appKey && APPS[appKey]) {
                APPS[appKey].x = newX;
                APPS[appKey].y = newY;
            }
        }
        dragJustFinished = true;
        setTimeout(() => { dragJustFinished = false; }, 350);
    }
    dragState = null;
}

// ---- 自动排列 ----
function arrangeDesktopIcons() {
    const desktop = document.getElementById('desktop');
    const desktopRect = desktop.getBoundingClientRect();
    const icons = desktop.querySelectorAll('.icon');
    if (icons.length === 0) return;
    const iconWidth = 80,
        iconHeight = 70,
        gapX = 20,
        gapY = 20;
    const cols = Math.max(2, Math.floor((desktopRect.width - 40) / (iconWidth + gapX)));
    const startX = 20,
        startY = 20;
    let idx = 0;
    icons.forEach(el => {
        const col = idx % cols;
        const row = Math.floor(idx / cols);
        const newX = startX + col * (iconWidth + gapX);
        const newY = startY + row * (iconHeight + gapY);
        el.style.left = newX + 'px';
        el.style.top = newY + 'px';
        idx++;
        const type = el.dataset.type;
        if (type === 'file') {
            const desk = getDesktopChildren();
            const fileName = el.dataset.fileName || el.dataset.id;
            if (desk && desk[fileName]) {
                desk[fileName]._pos = { x: newX, y: newY };
            }
        } else if (type === 'app') {
            const appKey = el.dataset.appKey;
            if (appKey && APPS[appKey]) {
                APPS[appKey].x = newX;
                APPS[appKey].y = newY;
            }
        }
    });
}

// ---- 右键菜单（桌面 + 图标）----
function initDesktopContextMenu() {
    const desktop = document.getElementById('desktop');
    const ctxMenu = document.getElementById('ctx-menu');

    desktop.addEventListener('contextmenu', (e) => {
        const icon = e.target.closest('.icon');
        if (icon) {
            e.preventDefault();
            e.stopPropagation();
            showIconContextMenu(e.clientX, e.clientY, icon);
            return;
        }
        e.preventDefault();
        showDesktopContextMenu(e.clientX, e.clientY);
    });
    // 触摸长按桌面空白
    let desktopLongPress = null;
    desktop.addEventListener('touchstart', (e) => {
        if (e.target === desktop) {
            desktopLongPress = setTimeout(() => {
                const touch = e.touches[0];
                showDesktopContextMenu(touch.clientX, touch.clientY);
            }, 600);
        }
    }, { passive: true });
    desktop.addEventListener('touchend', () => { clearTimeout(desktopLongPress); });
    desktop.addEventListener('touchmove', () => { clearTimeout(desktopLongPress); });

    document.addEventListener('click', (e) => {
        if (!e.target.closest('#ctx-menu')) {
            ctxMenu.style.display = 'none';
        }
    });
    document.addEventListener('touchstart', (e) => {
        if (!e.target.closest('#ctx-menu')) {
            ctxMenu.style.display = 'none';
        }
    });
    ctxMenu.addEventListener('contextmenu', e => e.preventDefault());
}

function showDesktopContextMenu(x, y) {
    const ctxMenu = document.getElementById('ctx-menu');
    ctxMenu.innerHTML = `
        <div class="ctx-item" data-action="new-text">📄 新建文本文档</div>
        <div class="ctx-item" data-action="new-folder">📁 新建文件夹</div>
        <div class="ctx-divider"></div>
        <div class="ctx-item" data-action="arrange">⊞ 自动排列</div>
        <div class="ctx-divider"></div>
        <div class="ctx-item" data-action="paste">📋 粘贴</div>
        <div class="ctx-item" data-action="refresh">🔄 刷新</div>
      `;
    ctxMenu.style.display = 'block';
    ctxMenu.style.left = Math.min(x, window.innerWidth - 200) + 'px';
    ctxMenu.style.top = Math.min(y, window.innerHeight - 240) + 'px';

    ctxMenu.querySelectorAll('.ctx-item').forEach(item => {
        item.addEventListener('click', (e) => {
            const action = item.dataset.action;
            ctxMenu.style.display = 'none';
            switch (action) {
                case 'new-text':
                    createDesktopTextFile();
                    break;
                case 'new-folder':
                    createDesktopFolder();
                    break;
                case 'arrange':
                    arrangeDesktopIcons();
                    break;
                case 'paste':
                    if (fmClipboard) {
                        const desk = getDesktopChildren();
                        const src = desk[fmClipboard];
                        if (src) {
                            let newName = fmClipboard;
                            let base = fmClipboard.replace(/\.[^/.]+$/, "");
                            let ext = fmClipboard.includes('.') ? fmClipboard.slice(fmClipboard
                                .lastIndexOf('.')) : '';
                            let i = 1;
                            while (desk[newName]) { newName = base + ' (' + i + ')' + ext;
                                i++; }
                            desk[newName] = JSON.parse(JSON.stringify(src));
                            if (fmClipboardCut) { delete desk[fmClipboard];
                                fmClipboard = null;
                                fmClipboardCut = false; }
                            renderDesktopIcons();
                            if (typeof fmCurrentPath !== 'undefined' && fmCurrentPath[fmCurrentPath
                                    .length - 1] === '桌面') {
                                renderFmList();
                            }
                        }
                    }
                    break;
                case 'refresh':
                    renderDesktopIcons();
                    break;
            }
        });
    });
}

function showIconContextMenu(x, y, icon) {
    const ctxMenu = document.getElementById('ctx-menu');
    const type = icon.dataset.type;
    const fileName = icon.dataset.fileName || icon.dataset.id;

    let items = '';
    if (type === 'file') {
        items = `
          <div class="ctx-item" data-action="open">📂 打开</div>
          <div class="ctx-item" data-action="rename">✏️ 重命名</div>
          <div class="ctx-item" data-action="delete">🗑 删除</div>
          <div class="ctx-divider"></div>
          <div class="ctx-item" data-action="copy">📋 复制</div>
          <div class="ctx-item" data-action="cut">✂️ 剪切</div>
        `;
    } else if (type === 'app') {
        items = `
          <div class="ctx-item" data-action="open-app">🚀 打开</div>
          <div class="ctx-divider"></div>
          <div class="ctx-item" data-action="arrange">⊞ 自动排列</div>
        `;
    }

    ctxMenu.innerHTML = items;
    ctxMenu.style.display = 'block';
    ctxMenu.style.left = Math.min(x, window.innerWidth - 200) + 'px';
    ctxMenu.style.top = Math.min(y, window.innerHeight - 200) + 'px';

    desktopIcons.forEach(ic => ic.classList.remove('selected'));
    icon.classList.add('selected');

    ctxMenu.querySelectorAll('.ctx-item').forEach(item => {
        item.addEventListener('click', (e) => {
            const action = item.dataset.action;
            ctxMenu.style.display = 'none';
            switch (action) {
                case 'open':
                    // 模拟打开
                    const desk = getDesktopChildren();
                    const itemData = desk[fileName];
                    if (itemData) {
                        if (itemData.type === 'text') openTextInNotepad(itemData);
                        else if (itemData.type === 'folder') { openWindow('files');
                            setTimeout(() => { fmGo(['C:', '桌面']); }, 80); } else if (itemData.type ===
                            'image') { openWindow('files');
                            setTimeout(() => { fmGo(['C:', '桌面']); }, 100); } else { openWindow('files');
                            setTimeout(() => { fmGo(['C:', '桌面']); }, 80); }
                    }
                    break;
                case 'rename':
                    const newName = prompt('重命名为：', fileName);
                    if (newName && newName.trim() && newName !== fileName) {
                        const desk = getDesktopChildren();
                        if (desk && desk[fileName]) {
                            const data = desk[fileName];
                            let finalName = newName.trim();
                            let i = 1;
                            while (desk[finalName]) { finalName = newName.trim() + ' (' + i + ')';
                                i++; }
                            desk[finalName] = data;
                            desk[finalName].name = finalName;
                            delete desk[fileName];
                            renderDesktopIcons();
                            if (typeof fmCurrentPath !== 'undefined' && fmCurrentPath[fmCurrentPath
                                    .length - 1] === '桌面') {
                                renderFmList();
                            }
                        }
                    }
                    break;
                case 'delete':
                    if (confirm('确定删除 "' + fileName + '" 吗？')) {
                        const desk = getDesktopChildren();
                        if (desk && desk[fileName]) {
                            delete desk[fileName];
                            renderDesktopIcons();
                            if (typeof fmCurrentPath !== 'undefined' && fmCurrentPath[fmCurrentPath
                                    .length - 1] === '桌面') {
                                renderFmList();
                            }
                        }
                    }
                    break;
                case 'copy':
                    fmClipboard = fileName;
                    fmClipboardCut = false;
                    break;
                case 'cut':
                    fmClipboard = fileName;
                    fmClipboardCut = true;
                    break;
                case 'open-app':
                    const appKey = icon.dataset.appKey;
                    if (appKey) openWindow(appKey);
                    break;
                case 'arrange':
                    arrangeDesktopIcons();
                    break;
            }
        });
    });
}

// ---- 新建桌面文件/文件夹 ----
function createDesktopTextFile() {
    const name = prompt('请输入文本文档名称：', '新建文档.txt');
    if (!name || !name.trim()) return;
    let finalName = name.trim();
    if (!/\.[^/.]+$/.test(finalName)) finalName += '.txt';
    const desk = getDesktopChildren();
    let finalName2 = finalName;
    let i = 1;
    while (desk[finalName2]) { finalName2 = finalName.replace(/\.[^/.]+$/, '') + ' (' + i + ')' + (finalName
            .includes('.') ? finalName.slice(finalName.lastIndexOf('.')) : '.txt');
        i++; }
    desk[finalName2] = {
        type: 'text',
        name: finalName2,
        content: '',
        ext: 'txt',
        _pos: { x: 80 + Math.random() * 200, y: 80 + Math.random() * 160 }
    };
    renderDesktopIcons();
    if (typeof fmCurrentPath !== 'undefined' && fmCurrentPath[fmCurrentPath.length - 1] === '桌面') {
        renderFmList();
    }
    const item = desk[finalName2];
    if (item) {
        openTextInNotepad(item);
    }
}

function createDesktopFolder() {
    const name = prompt('请输入文件夹名称：', '新建文件夹');
    if (!name || !name.trim()) return;
    const desk = getDesktopChildren();
    let finalName = name.trim();
    let i = 1;
    while (desk[finalName]) { finalName = name.trim() + ' (' + i + ')';
        i++; }
    desk[finalName] = {
        type: 'folder',
        children: {},
        _pos: { x: 80 + Math.random() * 200, y: 80 + Math.random() * 160 }
    };
    renderDesktopIcons();
    if (typeof fmCurrentPath !== 'undefined' && fmCurrentPath[fmCurrentPath.length - 1] === '桌面') {
        renderFmList();
    }
}

// ============================================================
//  6. 系统初始化
// ============================================================
function initDesktop() {
    getDesktopChildren();
    renderDesktopIcons();
    initDesktopContextMenu();

    const menu = document.getElementById('start-menu');
    menu.innerHTML = `
        <div style="padding:12px;font-size:18px;color:#fff;font-weight:bold;border-bottom:1px solid #33335a;margin-bottom:6px;">🚀 TurboOS</div>
        ${Object.keys(APPS).map(k => `<div class="sm-item" onclick="openWindow('${k}');document.getElementById('start-menu').classList.remove('open')"><span class="sm-glyph">${APPS[k].glyph}</span><span>${APPS[k].name}</span></div>`).join('')}
        <div style="height:1px;background:#33335a;margin:6px 0;"></div>
        <div class="sm-item" onclick="shutdownSystem();document.getElementById('start-menu').classList.remove('open')"><span class="sm-glyph">⏻</span><span style="color:#e81123;">关闭所有窗口</span></div>
      `;

    document.getElementById('start-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        document.getElementById('start-menu').classList.toggle('open');
    });
    document.addEventListener('click', () => document.getElementById('start-menu').classList.remove('open'));

    document.getElementById('arrange-btn').addEventListener('click', arrangeDesktopIcons);

    function updateClock() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('clock').textContent = h + ':' + m;
    }
    updateClock();
    setInterval(updateClock, 1000);

    function applyFullscreenClass() { document.body.classList.add('turbo-fullscreen'); }

    function removeFullscreenClass() { document.body.classList.remove('turbo-fullscreen'); }
    window.toggleFullscreen = function() {
        const el = document.getElementById('desktop') || document.body;
        if (!document.fullscreenElement) {
            if (el.requestFullscreen) { el.requestFullscreen().then(applyFullscreenClass).catch(() =>
                    applyFullscreenClass()); } else applyFullscreenClass();
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
            else removeFullscreenClass();
        }
    };
    document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement) removeFullscreenClass();
        else applyFullscreenClass();
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'F11') { e.preventDefault();
            window.toggleFullscreen(); }
        if (e.altKey && e.key === 'Escape') shutdownSystem();
    });
    const taskbar = document.getElementById('taskbar');
    if (taskbar) {
        taskbar.addEventListener('dblclick', (e) => { if (e.target === taskbar) window.toggleFullscreen(); });
    }
    window.addEventListener('resize', removeFullscreenClass);
}

function shutdownSystem() {
    if (confirm('确定关闭所有窗口吗？')) {
        Object.keys(windows).forEach(k => closeWindow(k));
    }
}

};

initDesktop();
